name: Deliver to censhare
# censhare HyperScaler partner kit v2026.11.27-a09bd908, the automations example. Each push to a delegated branch has the
# kit build the functions' images, then stores this commit's functions and workflows once, by digest, in the customer's
# package store and activates them in that branch's stage: main → dev, test → test (only if the customer delegated test
# to you). Functions first, then the workflows that call them. Prod is never delivered by a pipeline.
on:
  push:
    branches: [main, test]
# GitHub vouches for this workflow with its OIDC token; no key is stored.
permissions: { id-token: write, contents: read }
concurrency:
  group: censhare-deliver-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  deliver:
    # Only the delegated branches: a run dispatched on another ref would say dev and then be refused by AWS.
    if: github.ref_name == 'main' || github.ref_name == 'test'
    runs-on: ubuntu-latest
    env:
      # The kit builds each image functions.json names plainly, from functions/<image>/ with its Dockerfile, for
      # linux/arm64, after running functions/build.sh if there is one: the same build, and the same messages, as on
      # CodeCommit. An image named from a registry by digest (<registry>/<name>@sha256:...) is pulled instead.
      BUILD_IMAGES: "yes"
    steps:
      # With the history: the store records the last commit that changed your functions, so a workflows-only change
      # on test does not wait for functions nobody promotes. A shallow clone works too; its workflows then wait.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The branch's role must be set: otherwise AWS only says "not authorized" (and test would try main's role).
      - name: Check the publisher role variable
        env:
          ROLE_VAR: ${{ github.ref_name == 'test' && 'CENSHARE_PUBLISHER_ROLE_TEST' || 'CENSHARE_PUBLISHER_ROLE' }}
          CENSHARE_PUBLISHER_ROLE: ${{ vars.CENSHARE_PUBLISHER_ROLE }}
          CENSHARE_PUBLISHER_ROLE_TEST: ${{ vars.CENSHARE_PUBLISHER_ROLE_TEST }}
        run: |
          [ -n "${!ROLE_VAR}" ] && exit 0
          echo "::error::Set the repository variable $ROLE_VAR to the publisher role the customer gave you for $GITHUB_REF_NAME (Settings → Secrets and variables → Actions → Variables)."
          exit 1
      # The cells run on linux/arm64: QEMU lets the kit build that on GitHub's x86 runners.
      - uses: docker/setup-qemu-action@v3
      - uses: entirely-workspace/hyperscaler-delivery@v2026.11.27-a09bd908
        with:
          customer: ${{ vars.CENSHARE_CUSTOMER }}
          packages-bucket: ${{ vars.CENSHARE_PACKAGES_BUCKET }}
          # Each delegated branch has its own role (it trusts that branch only): test's is CENSHARE_PUBLISHER_ROLE_TEST.
          publisher-role: ${{ github.ref_name == 'test' && vars.CENSHARE_PUBLISHER_ROLE_TEST || vars.CENSHARE_PUBLISHER_ROLE }}
          stage: ${{ github.ref_name == 'test' && 'test' || 'dev' }}
